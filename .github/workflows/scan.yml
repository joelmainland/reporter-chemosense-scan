name: Weekly RePORTER chemosensory scan

on:
  schedule:
    - cron: "0 12 * * 0"   # Sundays 12:00 UTC, after RePORTER's Saturday load
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # fast binary packages

      - name: Install R packages
        run: Rscript -e 'install.packages(c("pacman", "tidyverse", "httr2", "jsonlite"))'

      - name: Run scan
        run: Rscript scan.R

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Scan $(date -u +%F)" || echo "No changes to commit"
          git push
